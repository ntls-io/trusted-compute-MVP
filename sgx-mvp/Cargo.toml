# Explicit workspace membership. The path crates below are dependencies of the
# enclave binary, but they must also be workspace members so they can be built
# and tested individually with `cargo -p <crate>` — the enclave binary itself
# links libpython3.8 and only builds inside the Gramine environment, so
# `cargo test` at the root is not possible on a dev machine.
#
# One shared Cargo.lock for all members is what pins the dependency graph that
# MRENCLAVE depends on. See measurements.toml.
[workspace]
members = [
    "oracle-verify",
    "wasmi-impl",
    "python-rust-impl",
    "json-append",
    "github-download",
]

[package]
name = "sgx-mvp"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmi-impl = { path = "wasmi-impl" }
python-rust-impl = { path = "python-rust-impl" }
json-append = { path = "json-append" }
github-download = { path = "github-download" }
serde_json = "1.0.127"
anyhow = "1.0"
tokio = { version = "1.40.0", features = ["full"] }
actix-web = { version = "4", features = ["rustls-0_23"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
aes-gcm = "0.10.3"
rand = "0.8.5"
hkdf = "0.12.4"
sha2 = "0.10.8"
once_cell = "1"
oracle-verify = { path = "oracle-verify" }