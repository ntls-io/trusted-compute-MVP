# Local development stack — NO SGX.
#
# Lives in trusted-compute-MVP but reaches into the sibling devops-acr checkout
# for the oracle image, matching the layout tests/integration/local-validator-test.sh
# already assumes (../devops-acr).
#
# Brings up Postgres, the devops-acr oracle, the enclave binary (without
# Gramine) and the Next.js frontend, so the chain -> oracle -> enclave path can
# be exercised on hardware without SGX.
#
# Start it with scripts/dev-up.sh rather than `docker compose up` directly: the
# script generates the oracle signing key, derives its public key and wires it
# into the enclave, which is the relationship SGX would otherwise enforce by
# measurement.
#
# NOT COVERED HERE (needs real SGX hardware): sealing, MRENCLAVE-keyed
# encryption, and attestation. See sgx-mvp/docker/Dockerfile.dev.
#
# On arm64 (Apple Silicon) the enclave image runs under qemu emulation because
# it links libpython3.8 from Ubuntu 20.04 amd64. The first build is slow —
# roughly 15-40 minutes — and cached afterwards.

name: blocktea-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ntls_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ntls_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  oracle:
    build:
      context: ../devops-acr
      dockerfile: Dockerfile
    environment:
      # Real devnet: the oracle verifies finalized transactions against a live
      # cluster, so this is not mocked.
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_CLUSTER: ${SOLANA_CLUSTER:-devnet}
      DRT_PROGRAM_ID: ${DRT_PROGRAM_ID:-CME2Dg7UEW82Hf99rQetEi7Hc5Db9JQPx6Azmx1eWbEE}
      # Generated by scripts/dev-up.sh. The service refuses to start without it.
      ORACLE_SIGNING_KEY_HEX: ${ORACLE_SIGNING_KEY_HEX:?run scripts/dev-up.sh instead of docker compose directly}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/oracle/v1/health')).get('signing_key_ok') else 1)\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  enclave:
    build:
      context: ./sgx-mvp
      dockerfile: docker/Dockerfile.dev
    platform: linux/amd64
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      # In production these arrive via the measured Gramine manifest and are
      # covered by MRENCLAVE. Here they are ordinary env vars, which is exactly
      # the guarantee this stack does not provide.
      ORACLE_URL: http://oracle:8000
      ORACLE_ED25519_PUBKEY_HEX: ${ORACLE_PUBKEY_HEX:?run scripts/dev-up.sh instead of docker compose directly}
      EXPECTED_CLUSTER: ${SOLANA_CLUSTER:-devnet}
      EXPECTED_PROGRAM_ID: ${DRT_PROGRAM_ID:-CME2Dg7UEW82Hf99rQetEi7Hc5Db9JQPx6Azmx1eWbEE}
      ORACLE_TIMEOUT_SECONDS: "15"
      DATA_DIR: /data
    ports:
      - "8443:8081"
    volumes:
      # Plaintext, unlike the sealed encrypted mount in production.
      - enclave-data:/data

  web:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ntls_dev?schema=public
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./ntc-web:/app
      - web-node-modules:/app/node_modules
    command: >
      sh -c "npm install &&
             npx prisma generate &&
             npx prisma db push --accept-data-loss &&
             npm run dev"

volumes:
  pgdata:
  enclave-data:
  web-node-modules:
